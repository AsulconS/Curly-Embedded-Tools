<html><body>
Reports a <code>&gt; REGION</code> or <code>AT&gt; REGION</code> clause naming a region that the
<code>MEMORY</code> block does not declare. <code>ld</code> rejects the script outright in that case.
<p>Scripts with no <code>MEMORY</code> block at all are skipped, since they place sections by
address.</p>
</body></html>
